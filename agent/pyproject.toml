[project]
name = "odin-zapros-agent"
version = "0.1.0"
description = "О!дин запрос: прототип ИИ-агента для путешествий (хакатон Островка)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.60",
    "tzdata>=2024.1",
]

[project.scripts]
odin = "odin.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
# RUF001-003 принимают русские слова из «похожих на латиницу» букв («не», «его», «с») за
# подмену символов; в русскоязычных докстрингах, комментариях и текстах это ложные срабатывания.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Pydantic рекомендует @computed_field поверх @property, а mypy этот приём не понимает.
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
